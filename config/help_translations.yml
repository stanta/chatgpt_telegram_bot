HELP_MESSAGE: 
  en: "Commands: \n⚪ /retry – Regenerate last bot answer\n⚪ /new – Start new dialog\n⚪ /settings – Show settings\n⚪ /balance – Show balance\n⚪ /help – Show help\n\n🎨 Generate images from text prompts in <b>👩‍🎨 Artist</b> /mode\n👥 Add bot to <b>group chat</b> /help_group_chat\n🎤 You can send <b>Voice Messages</b> instead of text\n"
  ar: "الأوامر:\n⚪ /retry – إعادة توليد آخر رد من البوت\n⚪ /new – بدء حوار جديد\n⚪ /settings – عرض الإعدادات\n⚪ /balance – عرض الرصيد\n⚪ /help – عرض المساعدة\n\n🎨 توليد صور من النصوص في وضع <b>👩‍🎨 الفنان</b> /mode\n👥 إضافة البوت إلى <b>دردشة المجموعة</b> \\: /help_group_chat\n🎤 يمكنك إرسال <b>رسائل صوتية</b> بدلاً من النصوص\n"
  bn: "কমান্ডসমূহ:\n⚪ /retry – বটের শেষ উত্তর পুনরায় জেনারেট করুন\n⚪ /new – নতুন সংলাপ শুরু করুন\n⚪ /settings – সেটিংস দেখুন\n⚪ /balance – ব্যালেন্স দেখুন\n⚪ /help – সাহায্য দেখুন\n\n🎨 টেক্সট প্রম্পট থেকে ছবি জেনারেট করুন <b>👩‍🎨 শিল্পী</b> /mode-এ\n👥 বটকে <b>গ্রুপ চ্যাট</b>-এ যোগ করুন: /help_group_chat\n🎤 আপনি টেক্সটের বদলে <b>ভয়েস মেসেজ</b> পাঠাতে পারেন\n"
  de: "Befehle:\n⚪ /retry – Letzte Antwort des Bots neu generieren\n⚪ /new – Neuen Dialog starten\n⚪ /settings – Einstellungen anzeigen\n⚪ /balance – Guthaben anzeigen\n⚪ /help – Hilfe anzeigen\n\n🎨 Bilder aus Texteingaben im Modus <b>👩‍🎨 Künstler</b> generieren\n👥 Bot zu einem <b>Gruppenchat</b> hinzufügen: /help_group_chat\n🎤 Du kannst anstelle von Text auch <b>Sprachnachrichten</b> senden\n"
  es: "Comandos:\n⚪ /retry – Regenerar la última respuesta del bot\n⚪ /new – Iniciar nuevo diálogo\n⚪ /settings – Mostrar configuración\n⚪ /balance – Mostrar balance\n⚪ /help – Mostrar ayuda\n\n🎨 Genera imágenes a partir de indicaciones de texto en el modo <b>👩‍🎨 Artista</b> /mode\n👥 Añade el bot a un <b>chat de grupo</b>: /help_group_chat\n🎤 Puedes enviar <b>Mensajes de Voz</b> en lugar de texto\n"
  fa: "دستورات:\n⚪ /retry – بازتولید آخرین پاسخ ربات\n⚪ /new – شروع دیالوگ جدید\n⚪ /settings – نمایش تنظیمات\n⚪ /balance – نمایش تراز\n⚪ /help – نمایش کمک\n\n🎨 تولید تصاویر از متن در حالت <b>👩‍🎨 هنرمند</b>\n👥 افزودن ربات به <b>چت گروهی</b>: /help_group_chat\n🎤 شما می‌توانید به جای متن، <b>پیام صوتی</b> ارسال کنید\n"
  fr: "Commandes:\n⚪ /retry – Régénérer la dernière réponse du bot\n⚪ /new – Démarrer un nouveau dialogue\n⚪ /settings – Afficher les paramètres\n⚪ /balance – Afficher le solde\n⚪ /help – Afficher l'aide\n\n🎨 Générer des images à partir de textes dans le mode <b>👩‍🎨 Artiste</b>\n👥 Ajouter le bot à un <b>chat de groupe</b> : /help_group_chat\n🎤 Vous pouvez envoyer des <b>Messages Vocaux</b> au lieu de texte\n"
  hi: "कमांड:\n⚪ /retry – अंतिम बॉट उत्तर को पुन: उत्पन्न करें\n⚪ /new – नई बातचीत शुरू करें\n⚪ /settings – सेटिंग्स दिखाएं\n⚪ /balance – बैलेंस दिखाएं\n⚪ /help – सहायता दिखाएं\n\n🎨 टेक्स्ट प्रॉम्प्ट्स से छवियाँ उत्पन्न करें <b>👩‍🎨 कलाकार</b> /mode में\n👥 बॉट को <b>ग्रुप चैट</b> में जोड़ें: /help_group_chat\n🎤 आप टेक्स्ट के बजाय <b>वॉयस संदेश</b> भेज सकते हैं\n"
  id:  "Perintah:\n⚪ /retry – Menghasilkan ulang jawaban bot terakhir\n⚪ /new – Mulai dialog baru\n⚪ /settings – Tampilkan pengaturan\n⚪ /balance – Tampilkan saldo\n⚪ /help – Tampilkan bantuan\n\n🎨 Hasilkan gambar dari teks di mode <b>👩‍🎨 Seniman</b>\n👥 Tambahkan bot ke <b>obrolan grup</b>: /help_group_chat\n🎤 Anda dapat mengirim <b>Pesan Suara</b> daripada teks\n"
  pt: "Comandos:\n⚪ /retry – Regenerar a última resposta do bot\n⚪ /new – Iniciar um novo diálogo\n⚪ /settings – Mostrar configurações\n⚪ /balance – Mostrar saldo\n⚪ /help – Mostrar ajuda\n\n🎨 Gerar imagens a partir de prompts de texto no modo <b>👩‍🎨 Artista</b>\n👥 Adicionar o bot a um <b>chat em grupo</b>: /help_group_chat\n🎤 Você pode enviar <b>Mensagens de Voz</b> em vez de texto\n"
  ru: "Команды:\n⚪ /retry – Пересоздать последний ответ бота\n⚪ /new – Начать новый диалог\n⚪ /settings – Показать настройки\n⚪ /balance – Показать баланс\n⚪ /help – Показать помощь\n\n🎨 Генерируйте изображения из текстовых подсказок в режиме <b>👩‍🎨 Художник</b> /mode\n👥 Добавьте бота в <b>групповой чат</b>: /help_group_chat\n🎤 Вы можете отправлять <b>Голосовые сообщения</b> вместо текста\n"
  th:  "คำสั่ง:\n⚪ /retry – สร้างคำตอบล่าสุดของบอทใหม่\n⚪ /new – เริ่มบทสนทนาใหม่\n⚪ /settings – แสดงการตั้งค่า\n⚪ /balance – แสดงยอดเงิน\n⚪ /help – แสดงความช่วยเหลือ\n\n🎨 สร้างภาพจากคำสั่งข้อความในโหมด <b>👩‍🎨 ศิลปิน</b>\n👥 เพิ่มบอทเข้ากลุ่มแชท: /help_group_chat\n🎤 คุณสามารถส่ง <b>ข้อความเสียง</b> แทนข้อความได้\n"
  tr: "Komutlar:\n⚪ /retry – Son bot cevabını yeniden oluştur\n⚪ /new – Yeni bir diyalog başlat\n⚪ /settings – Ayarları göster\n⚪ /balance – Bakiyeyi göster\n⚪ /help – Yardım göster\n\n🎨 <b>👩‍🎨 Sanatçı</b> modunda metin komutlarından görüntüler oluştur\n👥 Botu <b>grup sohbetine</b> ekle: /help_group_chat\n🎤 Metin yerine <b>Sesli Mesajlar</b> gönderebilirsiniz\n"
  zh:  "命令:\n⚪ /retry – 重新生成上一个机器人的回答\n⚪ /new – 开始新的对话\n⚪ /settings – 显示设置\n⚪ /balance – 显示余额\n⚪ /help – 显示帮助\n\n🎨 在<b>👩‍🎨 艺术家</b>模式中根据文本提示生成图像\n👥 将机器人添加到<b>群聊</b>中: /help_group_chat\n🎤 您可以发送<b>语音消息</b>而不是文字\n"

HELP_GROUP_CHAT_MESSAGE: 
  en: You can add bot to any <b>group chat</b> to help and entertain its participants!\n\nInstructions (see <b>video</b> below):\n1. Add the bot to the group chat\n2. Make it an <b>admin</b>, so that it can see messages (all other rights can be restricted)\n3. You're awesome!\n\nTo get a reply from the bot in the chat – @ <b>tag</b> it or <b>reply</b> to its message.\nFor example \"{bot_username} write a poem about Telegram\"\n")
  ar: "يمكنك إضافة البوت إلى أي <b>دردشة جماعية</b> للمساعدة وإمتاع المشاركين!\n\nالتعليمات (شاهد <b>الفيديو</b> أدناه):\n1. أضف البوت إلى الدردشة الجماعية\n2. اجعله <b>مسؤولاً</b> حتى يتمكن من رؤية الرسائل (يمكن تقييد جميع الحقوق الأخرى)\n3. أنت رائع!\n\nللحصول على رد من البوت في الدردشة – @ <b>اذكره</b> أو <b>رد</b> على رسالته.\nعلى سبيل المثال: '{bot_username} اكتب قصيدة عن Telegram '\n"
  bn: "আপনি বটকে যে কোনো <b>গ্রুপ চ্যাট</b>-এ যোগ করতে পারেন যাতে এটি অংশগ্রহণকারীদের সাহায্য করতে এবং তাদের বিনোদন দিতে পারে!\n\nনির্দেশাবলী (নীচের <b>ভিডিও</b> দেখুন):\n1. বটকে গ্রুপ চ্যাটে যোগ করুন\n2. একে <b>অ্যাডমিন</b> বানান যাতে এটি মেসেজ দেখতে পারে (অন্যান্য অধিকার সীমাবদ্ধ করা যেতে পারে)\n3. আপনি দারুণ!\n\nচ্যাটে বট থেকে উত্তর পেতে – একে @ <b>ট্যাগ</b> করুন বা এর মেসেজের <b>উত্তর</b> দিন।\nউদাহরণ: '{bot_username} টেলিগ্রামের ওপর একটি কবিতা লিখুন'\n"
  de: "Du kannst den Bot zu jedem <b>Gruppenchat</b> hinzufügen, um den Teilnehmern zu helfen und sie zu unterhalten!\n\nAnleitung (siehe <b>Video</b> unten):\n1. Füge den Bot dem Gruppenchat hinzu\n2. Mach ihn zum <b>Admin</b>, damit er Nachrichten sehen kann (alle anderen Rechte können eingeschränkt werden)\n3. Du bist großartig!\n\nUm eine Antwort vom Bot im Chat zu erhalten, @ <b>markiere</b> ihn oder <b>antworte</b> auf seine Nachricht.\nZum Beispiel: '{bot_username} schreibe ein Gedicht über Telegram'\n"
  es: "¡Puedes añadir el bot a cualquier <b>chat de grupo</b> para ayudar y entretener a sus participantes!\n\nInstrucciones (ver el <b>video</b> abajo):\n1. Añade el bot al chat de grupo\n2. Conviértelo en <b>administrador</b> para que pueda ver los mensajes (todos los demás permisos pueden ser restringidos)\n3. ¡Eres genial!\n\nPara obtener una respuesta del bot en el chat, <b>menciónalo</b> con @ o <b>responde</b> a su mensaje.\nPor ejemplo: '{bot_username} escribe un poema sobre Telegram '\n"
  fa: "شما می‌توانید ربات را به هر <b>چت گروهی</b> اضافه کنید تا به شرکت‌کنندگان کمک کرده و آن‌ها را سرگرم کند!\n\nدستورالعمل‌ها (ویدیو را در زیر مشاهده کنید):\n1. ربات را به چت گروهی اضافه کنید\n2. آن را <b>ادمین</b> کنید تا بتواند پیام‌ها را ببیند (سایر مجوزها قابل محدود کردن هستند)\n3. شما فوق‌العاده‌اید!\n\nبرای دریافت پاسخ از ربات در چت – آن را با @ <b>منشن</b> کنید یا به پیامش <b>پاسخ</b> دهید.\nمثال: '{bot_username} یک شعر درباره تلگرام بنویس'\n"
  fr: "Vous pouvez ajouter le bot à n'importe quel <b>chat de groupe</b> pour aider et divertir les participants!\n\nInstructions (voir la <b>vidéo</b> ci-dessous) :\n1. Ajoutez le bot au chat de groupe\n2. Faites-le <b>administrateur</b> pour qu'il puisse voir les messages (tous les autres droits peuvent être restreints)\n3. Vous êtes génial!\n\nPour obtenir une réponse du bot dans le chat, @ <b>taguez-le</b> ou <b>répondez</b> à son message.\nPar exemple : '{bot_username} écris un poème sur Telegram'\n"
  hi: "आप बॉट को किसी भी <b>ग्रुप चैट</b> में जोड़ सकते हैं ताकि यह प्रतिभागियों की मदद कर सके और उनका मनोरंजन कर सके!\n\nनिर्देश (नीचे <b>वीडियो</b> देखें):\n1. बॉट को ग्रुप चैट में जोड़ें\n2. इसे <b>एडमिन</b> बनाएं, ताकि यह संदेश देख सके (अन्य सभी अधिकारों को प्रतिबंधित किया जा सकता है)\n3. आप अद्भुत हैं!\n\nचैट में बॉट से उत्तर पाने के लिए – इसे @ <b>टैग</b> करें या इसके संदेश का <b>उत्तर</b> दें।\nउदाहरण: '{bot_username} Telegram पर एक कविता लिखें'\n"
  id: "Anda bisa menambahkan bot ke <b>obrolan grup</b> untuk membantu dan menghibur pesertanya!\n\nInstruksi (lihat <b>video</b> di bawah):\n1. Tambahkan bot ke obrolan grup\n2. Jadikan bot sebagai <b>admin</b>, agar bisa melihat pesan (hak lainnya bisa dibatasi)\n3. Anda luar biasa!\n\nUntuk mendapatkan balasan dari bot di obrolan – @ <b>tag</b> bot atau <b>balas</b> pesannya.\nMisalnya: '{bot_username} tulis puisi tentang Telegram'\n"
  pt: "Você pode adicionar o bot a qualquer <b>chat em grupo</b> para ajudar e entreter seus participantes!\n\nInstruções (veja o <b>vídeo</b> abaixo):\n1. Adicione o bot ao chat em grupo\n2. Faça dele um <b>administrador</b> para que possa ver as mensagens (os outros direitos podem ser restritos)\n3. Você é incrível!\n\nPara obter uma resposta do bot no chat, <b>mencione-o</b> com @ ou <b>responda</b> à sua mensagem.\nPor exemplo: '{bot_username} escreva um poema sobre o Telegram'\n"
  ru: "Вы можете добавить бота в любой <b>групповой чат</b>, чтобы помочь и развлечь его участников!\n\nИнструкции (см. <b>видео</b> ниже):\n1. Добавьте бота в групповой чат\n2. Сделайте его <b>администратором</b>, чтобы он мог видеть сообщения (все остальные права можно ограничить)\n3. Вы замечательны!\n\nЧтобы получить ответ от бота в чате, <b>упомяните</b> его через @ или <b>ответьте</b> на его сообщение.\nНапример: '{bot_username} напиши стихотворение о Telegram '\n"
  th: "คุณสามารถเพิ่มบอทเข้ากับ <b>กลุ่มแชท</b> เพื่อช่วยเหลือและสร้างความบันเทิงให้กับผู้เข้าร่วมได้!\n\nคำแนะนำ (ดู <b>วิดีโอ</b> ด้านล่าง):\n1. เพิ่มบอทเข้ากลุ่มแชท\n2. ทำให้เป็น <b>แอดมิน</b> เพื่อให้มันสามารถเห็นข้อความได้ (สิทธิ์อื่น ๆ สามารถถูกจำกัดได้)\n3. คุณยอดเยี่ยมมาก!\n\nหากต้องการคำตอบจากบอทในแชท ให้ @ <b>แท็ก</b> หรือ <b>ตอบกลับ</b> ข้อความของบอท\nตัวอย่าง: '{bot_username} เขียนบทกลอนเกี่ยวกับ Telegram'\n"
  tr: "Botu herhangi bir <b>grup sohbetine</b> ekleyebilirsiniz, katılımcılara yardım edip onları eğlendirsin!\n\nTalimatlar (aşağıdaki <b>videoyu</b> izleyin):\n1. Botu grup sohbetine ekleyin\n2. Botu <b>yönetici</b> yapın, böylece mesajları görebilir (diğer tüm haklar kısıtlanabilir)\n3. Harikasınız!\n\nSohbette bottan yanıt almak için – @ ile <b>etiketleyin</b> ya da mesajına <b>cevap verin</b>.\nÖrneğin: '{bot_username} Telegram hakkında bir şiir yaz'\n"
  zh:  "您可以将机器人添加到任何<b>群聊</b>中，以帮助并娱乐其参与者！\n\n说明（见下方<b>视频</b>）：\n1. 将机器人添加到群聊中\n2. 将其设为<b>管理员</b>，这样它可以查看消息（其他权限可以被限制）\n3. 你太棒了！\n\n要在聊天中获得机器人的回复，请@ <b>标记</b>它或<b>回复</b>它的消息。\n例如: '{bot_username} 写一首关于Telegram的诗'\n"